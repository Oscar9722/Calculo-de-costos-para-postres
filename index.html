<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieCost Manager Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .highlight-flash {
            animation: flash 1.5s ease-out;
        }
        @keyframes flash {
            0% { background-color: #fef08a; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <!-- Firebase y Lógica de Inicialización -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCeFjx39gjV-fCkiLnI38sWs6xWd6hm8Sg",
            authDomain: "coockiecost-manager.firebaseapp.com",
            projectId: "coockiecost-manager",
            storageBucket: "coockiecost-manager.firebasestorage.app",
            messagingSenderId: "926772598851",
            appId: "1:926772598851:web:fffdb17e7c2a3bac3c1cf6"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.auth = getAuth(app);
        
        window.fs = { collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc };

        signInAnonymously(window.auth).then(() => {
            if(window.initReactApp) window.initReactApp();
        }).catch(error => {
            console.error("Error conectando a la nube:", error);
            document.getElementById("root").innerHTML = "<div class='p-10 text-center text-red-500'>Error de conexión a la base de datos. Verifica la consola.</div>";
        });
    </script>

    <!-- Aplicación React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Componente reutilizable para el Botón de Ayuda
        const HelpBtn = ({ text }) => {
            const [show, setShow] = useState(false);
            return (
                <span className="relative inline-block ml-2 cursor-pointer">
                    <button type="button" onClick={() => setShow(!show)} onBlur={() => setTimeout(() => setShow(false), 200)} className="text-gray-400 hover:text-blue-600 focus:outline-none transition-colors">
                        <i className="fas fa-question-circle"></i>
                    </button>
                    {show && (
                        <div className="absolute z-50 w-64 p-3 mt-2 text-sm font-normal text-white bg-gray-800 rounded-lg shadow-xl -left-28 top-full transform transition-all">
                            {text}
                            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -mt-2 w-0 h-0 border-l-8 border-r-8 border-b-8 border-transparent border-b-gray-800"></div>
                        </div>
                    )}
                </span>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('inventory');
            const [inventory, setInventory] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [sales, setSales] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubInv = window.fs.onSnapshot(window.fs.collection(window.db, "inventory"), (snapshot) => {
                    setInventory(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubRec = window.fs.onSnapshot(window.fs.collection(window.db, "recipes"), (snapshot) => {
                    setRecipes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubSales = window.fs.onSnapshot(window.fs.collection(window.db, "sales"), (snapshot) => {
                    setSales(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setLoading(false);
                });
                return () => { unsubInv(); unsubRec(); unsubSales(); };
            }, []);

            window.initReactApp = () => setLoading(false);
            if (loading) return <div className="flex h-screen items-center justify-center text-xl font-bold text-blue-600"><i className="fas fa-spinner fa-spin mr-3"></i> Conectando a la nube...</div>;

            return (
                <div className="max-w-6xl mx-auto p-4">
                    <header className="bg-white shadow rounded-lg mb-6 p-4 flex justify-between items-center overflow-x-auto">
                        <h1 className="text-2xl font-extrabold text-gray-800 whitespace-nowrap"><i className="fas fa-cookie-bite text-orange-500"></i> CookieCost Pro</h1>
                        <nav className="flex space-x-2 ml-4">
                            <TabBtn active={activeTab === 'inventory'} onClick={() => setActiveTab('inventory')} icon="fa-box" text="Inventario" />
                            <TabBtn active={activeTab === 'recipes'} onClick={() => setActiveTab('recipes')} icon="fa-book" text="Recetas" />
                            <TabBtn active={activeTab === 'analysis'} onClick={() => setActiveTab('analysis')} icon="fa-calculator" text="Análisis" />
                            <TabBtn active={activeTab === 'sales'} onClick={() => setActiveTab('sales')} icon="fa-chart-line" text="Ventas" />
                        </nav>
                    </header>

                    <main className="bg-white shadow rounded-lg p-6">
                        {activeTab === 'inventory' && <Inventory inventory={inventory} />}
                        {activeTab === 'recipes' && <Recipes recipes={recipes} inventory={inventory} />}
                        {activeTab === 'analysis' && <Analysis recipes={recipes} inventory={inventory} />}
                        {activeTab === 'sales' && <Sales sales={sales} recipes={recipes} />}
                    </main>
                </div>
            );
        }

        const TabBtn = ({ active, onClick, icon, text }) => (
            <button onClick={onClick} className={`px-4 py-2 rounded-md font-semibold flex items-center ${active ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                <i className={`fas ${icon} mr-2`}></i> {text}
            </button>
        );

        // --- MÓDULO: INVENTARIO ---
        function Inventory({ inventory }) {
            const [form, setForm] = useState({ name: '', qty: '', unit: '', price: '', category: 'Ingrediente' });
            const [editId, setEditId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            const [sortBy, setSortBy] = useState('name-asc');
            const formRef = useRef(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (editId) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "inventory", editId), form);
                    setEditId(null);
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "inventory"), form);
                }
                setForm({ name: '', qty: '', unit: '', price: '', category: 'Ingrediente' });
            };

            const handleEdit = (item) => {
                setForm(item);
                setEditId(item.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (formRef.current) {
                    formRef.current.classList.remove('highlight-flash');
                    void formRef.current.offsetWidth;
                    formRef.current.classList.add('highlight-flash');
                }
            };

            const handleDelete = async (id) => {
                if (window.confirm('¿Estás seguro de que deseas eliminar este elemento del inventario?')) {
                    await window.fs.deleteDoc(window.fs.doc(window.db, "inventory", id));
                }
            };

            let filteredList = inventory.filter(i => 
                i.name.toLowerCase().includes(searchTerm.toLowerCase()) && 
                (filterCategory === 'All' || i.category === filterCategory)
            );

            filteredList.sort((a, b) => {
                if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
                if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
                if (sortBy === 'price-asc') return (a.price / a.qty) - (b.price / b.qty);
                if (sortBy === 'price-desc') return (b.price / b.qty) - (a.price / a.qty);
            });

            return (
                <div>
                    <h2 className="text-xl font-bold mb-4 border-b pb-2 flex items-center">
                        Gestión de Inventario 
                        <HelpBtn text="Registra aquí todos tus insumos. Ingresa el total que compraste (ej. si compras 1kg, escribe 1000 y elige gramos) y cuánto pagaste por ese total. El sistema calculará el costo por gramo/pieza automáticamente." />
                    </h2>
                    <form ref={formRef} onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4 mb-8 p-4 rounded-lg border transition-colors duration-300">
                        <div className="md:col-span-2">
                            <label className="block text-sm font-medium mb-1">Nombre</label>
                            <input required type="text" className="w-full border p-2 rounded" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Cant. Compra</label>
                            <input required type="number" step="0.01" className="w-full border p-2 rounded" value={form.qty} onChange={e => setForm({...form, qty: Number(e.target.value)})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Unidad</label>
                            <select className="w-full border p-2 rounded" value={form.unit} onChange={e => setForm({...form, unit: e.target.value})}>
                                <option value="g">Gramos (g)</option>
                                <option value="ml">Mililitros (ml)</option>
                                <option value="pza">Pieza (pza)</option>
                                <option value="kg">Kilogramos (kg)</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Precio Total</label>
                            <input required type="number" step="0.01" className="w-full border p-2 rounded" value={form.price} onChange={e => setForm({...form, price: Number(e.target.value)})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Categoría</label>
                            <select className="w-full border p-2 rounded" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                <option>Ingrediente</option>
                                <option>Empaque</option>
                            </select>
                        </div>
                        <div className="md:col-span-6 flex justify-end gap-2">
                            {editId && <button type="button" onClick={() => {setEditId(null); setForm({ name: '', qty: '', unit: '', price: '', category: 'Ingrediente' })}} className="bg-gray-400 text-white px-4 py-2 rounded">Cancelar</button>}
                            <button type="submit" className={`px-4 py-2 rounded text-white ${editId ? 'bg-green-600' : 'bg-blue-600'}`}>{editId ? 'Actualizar Producto' : 'Guardar Producto'}</button>
                        </div>
                    </form>

                    <div className="flex flex-col md:flex-row gap-4 mb-4 bg-gray-50 p-3 rounded border">
                        <input type="text" placeholder="Buscar producto..." className="border p-2 rounded flex-1" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        <select className="border p-2 rounded" value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
                            <option value="All">Todas las categorías</option>
                            <option value="Ingrediente">Solo Ingredientes</option>
                            <option value="Empaque">Solo Empaques</option>
                        </select>
                        <select className="border p-2 rounded" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                            <option value="name-asc">Nombre (A-Z)</option>
                            <option value="name-desc">Nombre (Z-A)</option>
                            <option value="price-asc">Precio Unitario (Menor a Mayor)</option>
                            <option value="price-desc">Precio Unitario (Mayor a Menor)</option>
                        </select>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-800 text-white">
                                    <th className="p-3 border">Nombre</th>
                                    <th className="p-3 border">Categoría</th>
                                    <th className="p-3 border">Cant. Compra</th>
                                    <th className="p-3 border">Precio Compra</th>
                                    <th className="p-3 border">Costo Unitario</th>
                                    <th className="p-3 border">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredList.map(item => (
                                    <tr key={item.id} className="hover:bg-gray-100 border-b">
                                        <td className="p-3">{item.name}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs text-white ${item.category === 'Ingrediente' ? 'bg-green-500' : 'bg-purple-500'}`}>{item.category}</span></td>
                                        <td className="p-3">{item.qty} {item.unit}</td>
                                        <td className="p-3">${item.price.toFixed(2)}</td>
                                        <td className="p-3 font-semibold text-blue-600">${(item.price / item.qty).toFixed(4)} /{item.unit}</td>
                                        <td className="p-3 flex space-x-2">
                                            <button onClick={() => handleEdit(item)} className="text-yellow-600 hover:text-yellow-800"><i className="fas fa-edit"></i></button>
                                            <button onClick={() => handleDelete(item.id)} className="text-red-600 hover:text-red-800"><i className="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                ))}
                                {filteredList.length === 0 && <tr><td colSpan="6" className="text-center p-4 text-gray-500">No hay productos que coincidan.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- MÓDULO: RECETAS ---
        function Recipes({ recipes, inventory }) {
            const [viewMode, setViewMode] = useState('edit');
            const [form, setForm] = useState({ name: '', ingredients: [], instructions: '' });
            const [editId, setEditId] = useState('');
            const ingList = inventory.filter(i => i.category === 'Ingrediente');

            const resetForm = () => { setForm({ name: '', ingredients: [], instructions: '' }); setEditId(''); };
            const handleLoadRecipe = (id) => {
                if(!id) { resetForm(); return; }
                setForm(recipes.find(x => x.id === id));
                setEditId(id);
            };
            const handleAddIngredient = () => setForm({ ...form, ingredients: [...form.ingredients, { invId: '', qty: '' }] });
            const handleIngChange = (index, field, val) => {
                const newIng = [...form.ingredients];
                newIng[index][field] = val;
                setForm({ ...form, ingredients: newIng });
            };
            const handleRemoveIng = (index) => setForm({ ...form, ingredients: form.ingredients.filter((_, i) => i !== index) });

            const handleSave = async () => {
                if(!form.name) return alert("Ponle nombre a la receta");
                if (editId) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "recipes", editId), form);
                    alert("Receta actualizada");
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "recipes"), form);
                    alert("Receta creada");
                }
                resetForm();
            };

            const handleDelete = async () => {
                if (editId && window.confirm('¿Seguro que deseas ELIMINAR esta receta de forma permanente?')) {
                    await window.fs.deleteDoc(window.fs.doc(window.db, "recipes", editId));
                    resetForm();
                }
            };

            return (
                <div>
                    <div className="flex border-b mb-4">
                        <button className={`px-4 py-2 font-bold ${viewMode === 'edit' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`} onClick={() => setViewMode('edit')}>Crear/Editar Receta</button>
                        <button className={`px-4 py-2 font-bold ${viewMode === 'consult' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`} onClick={() => setViewMode('consult')}>Consultar Recetas</button>
                    </div>

                    {viewMode === 'edit' && (
                        <div className="max-w-3xl">
                            <div className="mb-4 bg-blue-50 p-4 rounded-lg border">
                                <label className="block text-sm font-bold mb-1">
                                    Seleccionar Receta Existente (Para Actualizar)
                                    <HelpBtn text="Selecciona una receta de esta lista si deseas modificar sus ingredientes o instrucciones. Si quieres crear una desde cero, déjalo en 'Crear Nueva Receta'." />
                                </label>
                                <select className="w-full border p-2 rounded" value={editId} onChange={(e) => handleLoadRecipe(e.target.value)}>
                                    <option value="">-- Crear Nueva Receta --</option>
                                    {recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                </select>
                            </div>

                            <div className="mb-4">
                                <label className="block font-bold mb-1">Nombre de la Receta</label>
                                <input type="text" className="w-full border p-2 rounded font-bold text-lg" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Ej. Pastel de Chocolate" />
                            </div>

                            <div className="mb-4">
                                <label className="block font-bold mb-1">Instrucciones de Preparación</label>
                                <textarea className="w-full border p-2 rounded" rows="4" value={form.instructions || ''} onChange={e => setForm({...form, instructions: e.target.value})} placeholder="1. Precalentar horno...\n2. Mezclar secos..."></textarea>
                            </div>

                            <h3 className="font-bold text-gray-700 mb-2 border-b pb-1">Ingredientes</h3>
                            {form.ingredients.map((ing, i) => (
                                <div key={i} className="flex gap-2 mb-2 items-center">
                                    <select className="flex-1 border p-2 rounded" value={ing.invId} onChange={e => handleIngChange(i, 'invId', e.target.value)}>
                                        <option value="">Selecciona ingrediente...</option>
                                        {ingList.map(inv => <option key={inv.id} value={inv.id}>{inv.name} ({inv.unit})</option>)}
                                    </select>
                                    <input type="number" placeholder="Cantidad" className="w-32 border p-2 rounded" value={ing.qty} onChange={e => handleIngChange(i, 'qty', Number(e.target.value))} />
                                    <button onClick={() => handleRemoveIng(i)} className="bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600"><i className="fas fa-times"></i></button>
                                </div>
                            ))}
                            
                            <button onClick={handleAddIngredient} className="text-blue-600 font-bold mt-2 hover:underline"><i className="fas fa-plus"></i> Agregar Ingrediente</button>

                            <div className="mt-8 pt-4 border-t flex justify-end gap-3">
                                {editId && <button onClick={handleDelete} className="bg-red-600 text-white px-4 py-2 rounded shadow hover:bg-red-700">Eliminar Receta</button>}
                                <button onClick={resetForm} className="bg-gray-400 text-white px-4 py-2 rounded shadow hover:bg-gray-500">Limpiar / Cancelar</button>
                                <button onClick={handleSave} className="bg-green-600 text-white px-4 py-2 rounded shadow font-bold hover:bg-green-700">{editId ? 'Actualizar Receta' : 'Guardar Receta'}</button>
                            </div>
                        </div>
                    )}

                    {viewMode === 'consult' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {recipes.map(r => (
                                <div key={r.id} className="border p-4 rounded-lg shadow-sm bg-gray-50">
                                    <h3 className="text-xl font-bold text-gray-800 mb-2 border-b pb-2">{r.name}</h3>
                                    <p className="font-bold text-sm text-gray-600 mt-2">Ingredientes:</p>
                                    <ul className="list-disc pl-5 text-sm mb-4">
                                        {r.ingredients.map((ing, i) => {
                                            const dbItem = inventory.find(x => x.id === ing.invId);
                                            return <li key={i}>{dbItem ? `${dbItem.name}: ${ing.qty}${dbItem.unit}` : 'Ingrediente eliminado'}</li>
                                        })}
                                    </ul>
                                    <p className="font-bold text-sm text-gray-600">Instrucciones:</p>
                                    <p className="text-sm whitespace-pre-wrap bg-white p-3 border rounded mt-1">{r.instructions || 'Sin instrucciones'}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- MÓDULO: ANÁLISIS Y COSTEO ---
        function Analysis({ recipes, inventory }) {
            const [selRecipeId, setSelRecipeId] = useState('');
            const [packaging, setPackaging] = useState([]);
            // Ahora los porcentajes son editables por el usuario
            const [prodVars, setProdVars] = useState({ 
                totalPieces: 10, 
                piecesPerPack: 1,
                marginError: 5,
                opFee: 10,
                utility: 50
            });

            const recipe = recipes.find(r => r.id === selRecipeId);
            const empList = inventory.filter(i => i.category === 'Empaque');

            const handleAddPackaging = () => setPackaging([...packaging, { invId: '', qty: 1 }]);
            const handlePackChange = (index, field, val) => {
                const newPack = [...packaging];
                newPack[index][field] = val;
                setPackaging(newPack);
            };
            const handleRemovePack = (index) => setPackaging(packaging.filter((_, i) => i !== index));

            // Cálculos
            let totalMP = 0;
            if (recipe) {
                recipe.ingredients.forEach(ing => {
                    const item = inventory.find(x => x.id === ing.invId);
                    if (item) totalMP += (item.price / item.qty) * ing.qty;
                });
            }

            let totalEmp = 0;
            packaging.forEach(pack => {
                const item = inventory.find(x => x.id === pack.invId);
                if (item) totalEmp += (item.price / item.qty) * pack.qty;
            });

            const totalPackages = prodVars.totalPieces / (prodVars.piecesPerPack || 1);
            
            // Fórmulas actualizadas para usar las variables editables
            const marginErrorVal = totalMP * (prodVars.marginError / 100);
            const opFeeVal = totalMP * (prodVars.opFee / 100);
            const adjustedRM = totalMP + marginErrorVal + opFeeVal;
            
            // Utilidad dinámica
            const percUtil = prodVars.utility / 100;
            const utilityVal = percUtil < 1 ? (adjustedRM * percUtil) / (1 - percUtil) : 0; // Evitar división por cero si es 100%

            const priceWoVat = (adjustedRM + utilityVal) / totalPackages;
            const vat = priceWoVat * 0.16;
            const terminalFee = priceWoVat * 0.0406;
            
            const exactFinalPrice = priceWoVat + vat + terminalFee + totalEmp;
            const finalPriceRounded = Math.round(exactFinalPrice / 5) * 5;

            // Ganancias
            const costPerPack = (adjustedRM / totalPackages) + totalEmp;
            const profitPerPack = finalPriceRounded - costPerPack;
            const profitPerPiece = profitPerPack / prodVars.piecesPerPack;
            const totalProfit = profitPerPack * totalPackages;

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <h2 className="text-xl font-bold mb-4 flex items-center">
                            Configuración de Producción
                        </h2>
                        <select className="w-full border-2 border-blue-500 p-3 rounded font-bold mb-4" value={selRecipeId} onChange={e => setSelRecipeId(e.target.value)}>
                            <option value="">-- Selecciona una Receta --</option>
                            {recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </select>

                        {recipe && (
                            <>
                                {/* Empaques */}
                                <div className="mb-4 bg-gray-50 p-4 rounded border">
                                    <h3 className="font-bold text-gray-700 mb-2 flex items-center">
                                        Empaques por receta
                                        <HelpBtn text="Agrega aquí cajas, etiquetas o bolsas que se usarán para empacar la receta completa. Si haces 10 galletas y cada caja lleva 5, agrega 2 cajas aquí." />
                                    </h3>
                                    {packaging.map((pack, i) => (
                                        <div key={i} className="flex gap-2 mb-2 items-center">
                                            <select className="flex-1 border p-2 rounded" value={pack.invId} onChange={e => handlePackChange(i, 'invId', e.target.value)}>
                                                <option value="">Selecciona empaque...</option>
                                                {empList.map(inv => <option key={inv.id} value={inv.id}>{inv.name}</option>)}
                                            </select>
                                            <input type="number" placeholder="Cant" className="w-20 border p-2 rounded" value={pack.qty} onChange={e => handlePackChange(i, 'qty', Number(e.target.value))} />
                                            <button onClick={() => handleRemovePack(i)} className="text-red-500 p-2"><i className="fas fa-times"></i></button>
                                        </div>
                                    ))}
                                    <button onClick={handleAddPackaging} className="text-sm text-blue-600 font-bold mt-1"><i className="fas fa-plus"></i> Añadir Empaque</button>
                                </div>

                                {/* Porcentajes y variables de costo */}
                                <div className="mb-4 bg-blue-50 p-4 rounded border border-blue-200">
                                    <h3 className="font-bold text-gray-700 mb-3">Márgenes y Tarifas</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold whitespace-nowrap mb-1">
                                                Error (%)
                                                <HelpBtn text="Porcentaje que representa el error que puede haber al medir mal las porciones o que algunas piezas se desechen. Se sugiere un valor de entre 5% y 8%." />
                                            </label>
                                            <input type="number" className="w-full border p-2 rounded text-center" value={prodVars.marginError} onChange={e => setProdVars({...prodVars, marginError: Number(e.target.value)})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold whitespace-nowrap mb-1">
                                                T. Operativa (%)
                                                <HelpBtn text="Corresponde al desgaste de las herramientas y al uso de servicios como luz y gas. Se sugiere un valor entre 10% y 15%." />
                                            </label>
                                            <input type="number" className="w-full border p-2 rounded text-center" value={prodVars.opFee} onChange={e => setProdVars({...prodVars, opFee: Number(e.target.value)})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold whitespace-nowrap mb-1">
                                                Utilidad (%)
                                                <HelpBtn text="Es el porcentaje de ganancia neta que se desea obtener sobre el precio final. Se sugiere un valor entre 50% y 65%." />
                                            </label>
                                            <input type="number" className="w-full border p-2 rounded text-center" value={prodVars.utility} onChange={e => setProdVars({...prodVars, utility: Number(e.target.value)})} />
                                        </div>
                                    </div>
                                </div>

                                {/* Producción */}
                                <div className="grid grid-cols-3 gap-4 mb-6 bg-orange-50 p-4 rounded border border-orange-200">
                                    <div>
                                        <label className="block text-xs font-bold mb-1">
                                            Pzas Totales
                                            <HelpBtn text="La cantidad total de piezas individuales que salen al preparar esta receta completa." />
                                        </label>
                                        <input type="number" className="w-full border p-2 rounded text-center" value={prodVars.totalPieces} onChange={e => setProdVars({...prodVars, totalPieces: Number(e.target.value)})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">
                                            Pzas x Paquete
                                            <HelpBtn text="¿Cuántas piezas individuales incluye el empaque o paquete final que le vendes al cliente?" />
                                        </label>
                                        <input type="number" className="w-full border p-2 rounded text-center" value={prodVars.piecesPerPack} onChange={e => setProdVars({...prodVars, piecesPerPack: Number(e.target.value)})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">Total Paquetes</label>
                                        <div className="w-full border p-2 rounded bg-white text-center font-bold text-gray-600">{totalPackages.toFixed(1)}</div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    {recipe ? (
                        <div>
                            <h2 className="text-xl font-bold mb-4 bg-gray-800 text-white p-2 rounded text-center">Hoja de Costos y Precios</h2>
                            <table className="w-full text-left mb-6 border bg-white">
                                <tbody>
                                    <tr className="bg-gray-200 font-bold border-b"><td className="p-2">1. Materia Prima Total</td><td className="p-2 text-right">${totalMP.toFixed(2)}</td></tr>
                                    <tr className="bg-gray-200 font-bold border-b"><td className="p-2">2. Empaque Total (por paquete)</td><td className="p-2 text-right">${totalEmp.toFixed(2)}</td></tr>
                                    
                                    <tr className="border-b text-gray-600"><td className="p-2">Precio de Venta Base (Sin Impuestos)</td><td className="p-2 text-right">${priceWoVat.toFixed(2)}</td></tr>
                                    <tr className="border-b text-gray-600"><td className="p-2">+ IVA (16%)</td><td className="p-2 text-right">${vat.toFixed(2)}</td></tr>
                                    <tr className="border-b text-gray-600"><td className="p-2">+ Comisión Terminal (4.06%)</td><td className="p-2 text-right">${terminalFee.toFixed(2)}</td></tr>
                                    
                                    <tr className="bg-blue-600 text-white font-extrabold text-lg"><td className="p-3">PRECIO FINAL (Redondeado)</td><td className="p-3 text-right">${finalPriceRounded.toFixed(2)}</td></tr>
                                    <tr className="bg-blue-100 text-blue-800 text-xs text-center"><td colSpan="2" className="p-1">Precio sugerido exacto: ${exactFinalPrice.toFixed(2)}</td></tr>
                                </tbody>
                            </table>

                            <div className="bg-green-50 border border-green-200 rounded p-4 shadow-sm">
                                <h3 className="font-bold text-green-800 mb-3 border-b border-green-300 pb-1">Proyección de Ganancias</h3>
                                <div className="flex justify-between mb-2">
                                    <span className="text-gray-700">Ganancia por Pieza:</span>
                                    <span className="font-bold text-green-700">${profitPerPiece.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between mb-2">
                                    <span className="text-gray-700">Ganancia por Paquete:</span>
                                    <span className="font-bold text-green-700">${profitPerPack.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between text-lg mt-2 pt-2 border-t border-green-300">
                                    <span className="font-bold text-gray-800">Ganancia Total Producción:</span>
                                    <span className="font-extrabold text-green-700">${totalProfit.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="flex items-center justify-center border-2 border-dashed rounded-lg p-10 text-gray-400 bg-gray-50 mt-10">Selecciona una receta para ver los costos</div>
                    )}
                </div>
            );
        }

        // --- MÓDULO: VENTAS ---
        function Sales({ sales, recipes }) {
            const [form, setForm] = useState({ recipeId: '', qty: 1, date: new Date().toISOString().split('T')[0] });

            const handleRegisterSale = async (e) => {
                e.preventDefault();
                const r = recipes.find(x => x.id === form.recipeId);
                if(!r) return;
                
                await window.fs.addDoc(window.fs.collection(window.db, "sales"), {
                    recipeId: form.recipeId,
                    recipeName: r.name,
                    qty: Number(form.qty),
                    date: form.date,
                    timestamp: new Date().getTime()
                });
                alert("Venta registrada con éxito");
                setForm({...form, qty: 1});
            };

            const todayStr = new Date().toISOString().split('T')[0];
            const salesToday = sales.filter(s => s.date === todayStr).reduce((acc, curr) => acc + curr.qty, 0);
            const currentMonth = todayStr.substring(0, 7);
            const salesMonth = sales.filter(s => s.date.startsWith(currentMonth)).reduce((acc, curr) => acc + curr.qty, 0);

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-1 border rounded p-4 bg-gray-50">
                        <h3 className="font-bold text-lg mb-4 flex items-center">
                            Registrar Venta
                            <HelpBtn text="Registra cada vez que vendas un paquete. Esto te permitirá llevar el control en el dashboard y ver qué recetas son las más populares." />
                        </h3>
                        <form onSubmit={handleRegisterSale}>
                            <div className="mb-3">
                                <label className="block text-sm mb-1">Producto / Receta</label>
                                <select required className="w-full border p-2 rounded" value={form.recipeId} onChange={e => setForm({...form, recipeId: e.target.value})}>
                                    <option value="">Selecciona...</option>
                                    {recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                </select>
                            </div>
                            <div className="mb-3">
                                <label className="block text-sm mb-1">Paquetes Vendidos</label>
                                <input required type="number" min="1" className="w-full border p-2 rounded" value={form.qty} onChange={e => setForm({...form, qty: e.target.value})} />
                            </div>
                            <div className="mb-4">
                                <label className="block text-sm mb-1">Fecha</label>
                                <input required type="date" className="w-full border p-2 rounded" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                            </div>
                            <button type="submit" className="w-full bg-purple-600 text-white font-bold py-2 rounded shadow hover:bg-purple-700">Registrar Venta</button>
                        </form>
                    </div>

                    <div className="md:col-span-2">
                        <h3 className="font-bold text-lg mb-4">Dashboard de Ventas</h3>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <div className="bg-indigo-600 text-white p-4 rounded-lg shadow text-center">
                                <p className="text-sm opacity-80">Paquetes vendidos hoy</p>
                                <p className="text-4xl font-extrabold">{salesToday}</p>
                            </div>
                            <div className="bg-teal-600 text-white p-4 rounded-lg shadow text-center">
                                <p className="text-sm opacity-80">Paquetes vendidos (Mes actual)</p>
                                <p className="text-4xl font-extrabold">{salesMonth}</p>
                            </div>
                        </div>

                        <h4 className="font-bold text-gray-700 mb-2">Últimos Registros</h4>
                        <div className="overflow-x-auto max-h-64 border rounded shadow-sm">
                            <table className="w-full text-left text-sm bg-white">
                                <thead className="bg-gray-100 sticky top-0">
                                    <tr>
                                        <th className="p-2 border-b">Fecha</th>
                                        <th className="p-2 border-b">Producto</th>
                                        <th className="p-2 border-b text-center">Cantidad</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sales.sort((a,b) => b.timestamp - a.timestamp).slice(0, 20).map(s => (
                                        <tr key={s.id} className="border-b hover:bg-gray-50">
                                            <td className="p-2">{s.date}</td>
                                            <td className="p-2 font-semibold text-gray-700">{s.recipeName}</td>
                                            <td className="p-2 text-center">{s.qty}</td>
                                        </tr>
                                    ))}
                                    {sales.length === 0 && <tr><td colSpan="3" className="text-center p-4 text-gray-500">No hay ventas registradas aún.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
