<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetCost Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        .highlight-flash {
            animation: flash 1.5s ease-out;
        }
        @keyframes flash {
            0% { background-color: #fef3c7; }
            100% { background-color: transparent; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800">
    <div id="root"></div>

    <!-- Firebase y Lógica de Inicialización -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCeFjx39gjV-fCkiLnI38sWs6xWd6hm8Sg",
            authDomain: "coockiecost-manager.firebaseapp.com",
            projectId: "coockiecost-manager",
            storageBucket: "coockiecost-manager.firebasestorage.app",
            messagingSenderId: "926772598851",
            appId: "1:926772598851:web:fffdb17e7c2a3bac3c1cf6"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.auth = getAuth(app);
        
        window.fs = { collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc };

        signInAnonymously(window.auth).then(() => {
            if(window.initReactApp) window.initReactApp();
        }).catch(error => {
            console.error("Error conectando a la nube:", error);
            document.getElementById("root").innerHTML = "<div class='p-10 text-center text-rose-500'>Error de conexión a la base de datos. Verifica la consola.</div>";
        });
    </script>

    <!-- Aplicación React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HelpBtn = ({ text }) => {
            const [show, setShow] = useState(false);
            return (
                <span className="relative inline-block ml-2 cursor-pointer" style={{ zIndex: show ? 999 : 1 }}>
                    <button type="button" onClick={() => setShow(!show)} onBlur={() => setTimeout(() => setShow(false), 200)} className="text-stone-400 hover:text-rose-600 focus:outline-none transition-colors">
                        <i className="fas fa-question-circle"></i>
                    </button>
                    {show && (
                        <div className="absolute w-56 sm:w-64 p-3 mt-2 text-sm font-normal text-white bg-stone-800 rounded-lg shadow-xl left-1/2 transform -translate-x-1/2 top-full transition-all">
                            {text}
                            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -mt-2 w-0 h-0 border-l-8 border-r-8 border-b-8 border-transparent border-b-stone-800"></div>
                        </div>
                    )}
                </span>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('inventory');
            const [inventory, setInventory] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [sales, setSales] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubInv = window.fs.onSnapshot(window.fs.collection(window.db, "inventory"), (snapshot) => {
                    setInventory(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubRec = window.fs.onSnapshot(window.fs.collection(window.db, "recipes"), (snapshot) => {
                    setRecipes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubSales = window.fs.onSnapshot(window.fs.collection(window.db, "sales"), (snapshot) => {
                    setSales(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setLoading(false);
                });
                return () => { unsubInv(); unsubRec(); unsubSales(); };
            }, []);

            window.initReactApp = () => setLoading(false);
            if (loading) return <div className="flex h-screen items-center justify-center text-xl font-bold text-rose-600"><i className="fas fa-spinner fa-spin mr-3"></i> Conectando a la nube...</div>;

            return (
                <div className="max-w-6xl mx-auto p-4">
                    <header className="bg-white shadow-sm rounded-xl mb-6 p-4 flex justify-between items-center overflow-x-auto border border-stone-100">
                        <h1 className="text-2xl font-bold text-stone-800 whitespace-nowrap tracking-tight" style={{ fontFamily: "'Outfit', sans-serif" }}>
                            <i className="fas fa-chart-pie text-rose-500 mr-3 opacity-80"></i>SweetCost Manager
                        </h1>
                        <nav className="flex space-x-2 ml-4">
                            <TabBtn active={activeTab === 'inventory'} onClick={() => setActiveTab('inventory')} icon="fa-box" text="Inventario" />
                            <TabBtn active={activeTab === 'recipes'} onClick={() => setActiveTab('recipes')} icon="fa-book" text="Recetas" />
                            <TabBtn active={activeTab === 'analysis'} onClick={() => setActiveTab('analysis')} icon="fa-calculator" text="Análisis" />
                            <TabBtn active={activeTab === 'sales'} onClick={() => setActiveTab('sales')} icon="fa-chart-line" text="Ventas" />
                        </nav>
                    </header>

                    <main className="bg-white shadow-sm rounded-xl p-6 border border-stone-100">
                        {activeTab === 'inventory' && <Inventory inventory={inventory} />}
                        {activeTab === 'recipes' && <Recipes recipes={recipes} inventory={inventory} />}
                        {activeTab === 'analysis' && <Analysis recipes={recipes} inventory={inventory} />}
                        {activeTab === 'sales' && <Sales sales={sales} recipes={recipes} />}
                    </main>
                </div>
            );
        }

        const TabBtn = ({ active, onClick, icon, text }) => (
            <button onClick={onClick} className={`px-4 py-2 rounded-lg font-semibold flex items-center transition-colors ${active ? 'bg-rose-600 text-white shadow-md' : 'bg-stone-50 text-stone-600 hover:bg-stone-100'}`}>
                <i className={`fas ${icon} mr-2`}></i> {text}
            </button>
        );

        // --- MÓDULO: INVENTARIO ---
        function Inventory({ inventory }) {
            const [form, setForm] = useState({ name: '', qty: '', unit: 'g', price: '', category: 'Ingrediente' });
            const [editId, setEditId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            const [sortBy, setSortBy] = useState('name-asc');
            const formRef = useRef(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                // Formatear nombre: Primera mayúscula, resto minúscula
                let formattedName = form.name.trim();
                if (formattedName.length > 0) {
                    formattedName = formattedName.charAt(0).toUpperCase() + formattedName.slice(1).toLowerCase();
                }

                const dataToSave = {
                    ...form,
                    name: formattedName,
                    qty: Number(form.qty),
                    price: Number(form.price)
                };

                if (editId) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "inventory", editId), dataToSave);
                    setEditId(null);
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "inventory"), dataToSave);
                }
                setForm({ name: '', qty: '', unit: 'g', price: '', category: 'Ingrediente' });
            };

            const handleEdit = (item) => {
                const itemQty = item.qty || item.cantidad || '';
                setForm({
                    name: item.name || '',
                    qty: itemQty,
                    unit: item.unit || 'g',
                    price: item.price || '',
                    category: item.category || 'Ingrediente'
                });
                setEditId(item.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (formRef.current) {
                    formRef.current.classList.remove('highlight-flash');
                    void formRef.current.offsetWidth;
                    formRef.current.classList.add('highlight-flash');
                }
            };

            const handleDelete = async (id) => {
                if (window.confirm('¿Estás seguro de que deseas eliminar este elemento del inventario?')) {
                    await window.fs.deleteDoc(window.fs.doc(window.db, "inventory", id));
                }
            };

            let filteredList = inventory.filter(i => 
                (i.name || '').toLowerCase().includes(searchTerm.toLowerCase()) && 
                (filterCategory === 'All' || i.category === filterCategory)
            );

            filteredList.sort((a, b) => {
                const qtyA = a.qty || a.cantidad || 1;
                const qtyB = b.qty || b.cantidad || 1;
                const priceA = a.price || 0;
                const priceB = b.price || 0;
                const unitCostA = priceA / qtyA;
                const unitCostB = priceB / qtyB;

                if (sortBy === 'name-asc') return (a.name || '').localeCompare(b.name || '');
                if (sortBy === 'name-desc') return (b.name || '').localeCompare(a.name || '');
                if (sortBy === 'price-asc') return unitCostA - unitCostB;
                if (sortBy === 'price-desc') return unitCostB - unitCostA;
            });

            return (
                <div>
                    <h2 className="text-xl font-bold mb-4 border-b border-stone-200 pb-2 flex items-center text-stone-800">
                        Gestión de Inventario 
                        <HelpBtn text="Registra aquí todos tus insumos. Ingresa el total que compraste (ej. si compras 1kg, escribe 1000 y elige gramos) y cuánto pagaste. El sistema calculará el costo por unidad automáticamente." />
                    </h2>
                    <form ref={formRef} onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4 mb-8 p-5 bg-stone-50 rounded-xl border border-stone-200 transition-colors duration-300">
                        <div className="md:col-span-2">
                            <label className="block text-sm font-semibold text-stone-700 mb-1">Nombre</label>
                            <input required type="text" className="w-full border border-stone-300 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 p-2 rounded-lg outline-none" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-stone-700 mb-1">Cant. Compra</label>
                            <input required type="number" step="0.01" className="w-full border border-stone-300 focus:border-rose-500 p-2 rounded-lg outline-none" value={form.qty} onChange={e => setForm({...form, qty: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-stone-700 mb-1">Unidad</label>
                            <select className="w-full border border-stone-300 focus:border-rose-500 p-2 rounded-lg outline-none bg-white" value={form.unit} onChange={e => setForm({...form, unit: e.target.value})}>
                                <option value="g">Gramos (g)</option>
                                <option value="ml">Mililitros (ml)</option>
                                <option value="pza">Pieza (pza)</option>
                                <option value="kg">Kilogramos (kg)</option>
                                <option value="cm">Centímetros (cm)</option>
                                <option value="paq">Paquete (paq)</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-stone-700 mb-1">Precio Total</label>
                            <input required type="number" step="0.01" className="w-full border border-stone-300 focus:border-rose-500 p-2 rounded-lg outline-none" value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-stone-700 mb-1">Categoría</label>
                            <select className="w-full border border-stone-300 focus:border-rose-500 p-2 rounded-lg outline-none bg-white" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                <option>Ingrediente</option>
                                <option>Empaque</option>
                            </select>
                        </div>
                        <div className="md:col-span-6 flex justify-end gap-3 mt-2">
                            {editId && <button type="button" onClick={() => {setEditId(null); setForm({ name: '', qty: '', unit: 'g', price: '', category: 'Ingrediente' })}} className="bg-stone-300 hover:bg-stone-400 text-stone-800 px-4 py-2 rounded-lg font-medium transition-colors">Cancelar</button>}
                            <button type="submit" className={`px-5 py-2 rounded-lg font-semibold text-white shadow-sm transition-colors ${editId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-rose-600 hover:bg-rose-700'}`}>{editId ? 'Actualizar Producto' : 'Guardar Producto'}</button>
                        </div>
                    </form>

                    <div className="flex flex-col md:flex-row gap-4 mb-4 bg-white p-3 rounded-xl border border-stone-200 shadow-sm">
                        <input type="text" placeholder="Buscar producto..." className="border border-stone-300 focus:border-rose-500 p-2 rounded-lg flex-1 outline-none" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        <select className="border border-stone-300 p-2 rounded-lg outline-none bg-stone-50" value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
                            <option value="All">Todas las categorías</option>
                            <option value="Ingrediente">Solo Ingredientes</option>
                            <option value="Empaque">Solo Empaques</option>
                        </select>
                        <select className="border border-stone-300 p-2 rounded-lg outline-none bg-stone-50" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                            <option value="name-asc">Nombre (A-Z)</option>
                            <option value="name-desc">Nombre (Z-A)</option>
                            <option value="price-asc">Precio Unit. (Menor a Mayor)</option>
                            <option value="price-desc">Precio Unit. (Mayor a Menor)</option>
                        </select>
                    </div>

                    <div className="overflow-x-auto border border-stone-200 rounded-xl">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-stone-800 text-stone-100">
                                    <th className="p-3 border-b border-stone-700 font-semibold">Nombre</th>
                                    <th className="p-3 border-b border-stone-700 font-semibold">Categoría</th>
                                    <th className="p-3 border-b border-stone-700 font-semibold">Cant. Compra</th>
                                    <th className="p-3 border-b border-stone-700 font-semibold">Precio Compra</th>
                                    <th className="p-3 border-b border-stone-700 font-semibold">Costo Unitario</th>
                                    <th className="p-3 border-b border-stone-700 font-semibold">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white">
                                {filteredList.map(item => {
                                    const safeQty = Number(item.qty) || Number(item.cantidad) || 0;
                                    const safePrice = Number(item.price) || 0;
                                    const unitCost = safeQty > 0 ? (safePrice / safeQty) : 0;
                                    
                                    return (
                                        <tr key={item.id} className="hover:bg-stone-50 border-b border-stone-100 transition-colors">
                                            <td className="p-3 text-stone-700 font-medium">{item.name}</td>
                                            <td className="p-3"><span className={`px-2 py-1 rounded-md text-xs font-semibold text-white ${item.category === 'Ingrediente' ? 'bg-emerald-500' : 'bg-amber-500'}`}>{item.category}</span></td>
                                            <td className="p-3 text-stone-600">{safeQty > 0 ? safeQty : <span className="text-rose-500 text-xs font-bold bg-rose-50 px-2 py-1 rounded">Sin Cantidad</span>} {item.unit}</td>
                                            <td className="p-3 text-stone-600">${safePrice.toFixed(2)}</td>
                                            <td className="p-3 font-bold text-rose-600">${unitCost.toFixed(4)} <span className="text-stone-400 text-xs font-normal">/{item.unit}</span></td>
                                            <td className="p-3 flex space-x-3">
                                                <button onClick={() => handleEdit(item)} className="text-amber-500 hover:text-amber-700 transition-colors" title="Editar"><i className="fas fa-edit"></i></button>
                                                <button onClick={() => handleDelete(item.id)} className="text-rose-500 hover:text-rose-700 transition-colors" title="Eliminar"><i className="fas fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {filteredList.length === 0 && <tr><td colSpan="6" className="text-center p-8 text-stone-400 italic">No hay productos registrados aún.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- MÓDULO: RECETAS ---
        const SearchableSelect = ({ options, value, onChange, placeholder }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState('');
            const wrapperRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const selectedOpt = options.find(o => o.id === value);
            const displayValue = isOpen ? search : (selectedOpt ? selectedOpt.label : '');
            const filtered = options.filter(o => o.label.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="relative flex-1" ref={wrapperRef}>
                    <input 
                        type="text" 
                        className="w-full border border-stone-300 focus:border-rose-500 p-2.5 rounded-lg outline-none bg-white cursor-text"
                        placeholder={placeholder}
                        value={displayValue}
                        onChange={e => { setSearch(e.target.value); setIsOpen(true); }}
                        onClick={() => { setIsOpen(true); setSearch(''); }}
                    />
                    <i className="fas fa-chevron-down absolute right-3 top-3.5 text-stone-400 pointer-events-none text-xs"></i>
                    
                    {isOpen && (
                        <div className="absolute z-10 w-full mt-1 bg-white border border-stone-200 rounded-lg shadow-xl max-h-48 overflow-y-auto">
                            {filtered.length > 0 ? filtered.map(opt => (
                                <div 
                                    key={opt.id} 
                                    className="p-2.5 hover:bg-rose-50 cursor-pointer text-stone-700 border-b border-stone-50 last:border-0"
                                    onClick={() => { onChange(opt.id); setIsOpen(false); setSearch(''); }}
                                >
                                    {opt.label}
                                </div>
                            )) : <div className="p-2.5 text-stone-400 italic text-sm">No se encontraron ingredientes</div>}
                        </div>
                    )}
                </div>
            );
        };
        function Recipes({ recipes, inventory }) {
            const [viewMode, setViewMode] = useState('edit');
            const [form, setForm] = useState({ name: '', ingredients: [], instructions: '' });
            const [editId, setEditId] = useState('');
            const [consultSearchId, setConsultSearchId] = useState('');
            const ingList = inventory
                .filter(i => i.category === 'Ingrediente')
                .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            const resetForm = () => { setForm({ name: '', ingredients: [], instructions: '' }); setEditId(''); };
            const handleLoadRecipe = (id) => {
                if(!id) { resetForm(); return; }
                setForm(recipes.find(x => x.id === id));
                setEditId(id);
            };
            const handleAddIngredient = () => setForm({ ...form, ingredients: [...form.ingredients, { invId: '', qty: '' }] });
            const handleIngChange = (index, field, val) => {
                const newIng = [...form.ingredients];
                newIng[index][field] = val;
                setForm({ ...form, ingredients: newIng });
            };
            const handleRemoveIng = (index) => setForm({ ...form, ingredients: form.ingredients.filter((_, i) => i !== index) });

            const handleSave = async () => {
                if(!form.name) return alert("Ponle nombre a la receta");
                if (editId) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "recipes", editId), form);
                    alert("Receta actualizada");
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "recipes"), form);
                    alert("Receta creada");
                }
                resetForm();
            };

            const handleDelete = async () => {
                if (editId && window.confirm('¿Seguro que deseas ELIMINAR esta receta de forma permanente?')) {
                    await window.fs.deleteDoc(window.fs.doc(window.db, "recipes", editId));
                    resetForm();
                }
            };

            return (
                <div>
                    <div className="flex border-b border-stone-200 mb-6">
                        <button className={`px-5 py-3 font-bold transition-colors ${viewMode === 'edit' ? 'border-b-2 border-rose-600 text-rose-600' : 'text-stone-400 hover:text-stone-600'}`} onClick={() => setViewMode('edit')}>Crear/Editar Receta</button>
                        <button className={`px-5 py-3 font-bold transition-colors ${viewMode === 'consult' ? 'border-b-2 border-rose-600 text-rose-600' : 'text-stone-400 hover:text-stone-600'}`} onClick={() => setViewMode('consult')}>Consultar Recetas</button>
                    </div>

                    {viewMode === 'edit' && (
                        <div className="max-w-3xl">
                            <div className="mb-6 bg-rose-50 p-5 rounded-xl border border-rose-100 shadow-sm">
                                <label className="block text-sm font-bold text-rose-900 mb-2">
                                    Seleccionar Receta Existente
                                    <HelpBtn text="Selecciona una receta de esta lista si deseas modificar sus ingredientes o instrucciones. Déjalo en blanco para crear una nueva." />
                                </label>
                                <SearchableSelect 
                                    options={[{id: '', label: '-- Crear Nueva Receta --'}, ...recipes.sort((a, b) => a.name.localeCompare(b.name)).map(r => ({ id: r.id, label: r.name }))]}
                                    value={editId}
                                    onChange={(val) => handleLoadRecipe(val)}
                                    placeholder="Buscar receta para editar..."
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block font-semibold text-stone-700 mb-1">Nombre de la Receta</label>
                                <input type="text" className="w-full border border-stone-300 focus:border-rose-500 p-3 rounded-lg font-bold text-lg outline-none" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Ej. Pastel de Zanahoria" />
                            </div>
                            
                            <h3 className="font-bold text-stone-800 mb-3 mt-6 border-b border-stone-200 pb-2">Ingredientes de la mezcla</h3>
                            {form.ingredients.map((ing, i) => (
                                <div key={i} className="flex gap-3 mb-3 items-center">
                                    <SearchableSelect 
                                        options={ingList.map(inv => ({ id: inv.id, label: `${inv.name} (${inv.unit})` }))}
                                        value={ing.invId}
                                        onChange={val => handleIngChange(i, 'invId', val)}
                                        placeholder="Buscar ingrediente..."
                                    />
                                    <input type="number" placeholder="Cantidad" className="w-32 border border-stone-300 focus:border-rose-500 p-2.5 rounded-lg outline-none" value={ing.qty} onChange={e => handleIngChange(i, 'qty', Number(e.target.value))} />
                                    <button onClick={() => handleRemoveIng(i)} className="text-rose-500 hover:bg-rose-50 p-2.5 rounded-lg transition-colors"><i className="fas fa-times text-lg"></i></button>
                                </div>
                            ))}
                            
                            <button onClick={handleAddIngredient} className="text-rose-600 font-bold mt-2 mb-6 hover:bg-rose-50 px-3 py-2 rounded-lg transition-colors"><i className="fas fa-plus mr-1"></i> Agregar Ingrediente</button>

                            <div className="mb-6 mt-4">
                                <label className="block font-semibold text-stone-700 mb-1">Instrucciones de Preparación</label>
                                <textarea className="w-full border border-stone-300 focus:border-rose-500 p-3 rounded-lg outline-none" rows="4" value={form.instructions || ''} onChange={e => setForm({...form, instructions: e.target.value})} placeholder="1. Precalentar horno a 180°C...&#10;2. Mezclar secos..."></textarea>
                            </div>

                            <div className="mt-8 pt-6 border-t border-stone-200 flex justify-end gap-3">
                                {editId && <button onClick={handleDelete} className="text-rose-600 bg-rose-50 px-5 py-2.5 rounded-lg font-semibold hover:bg-rose-100 transition-colors">Eliminar Receta</button>}
                                <button onClick={resetForm} className="bg-stone-200 text-stone-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-stone-300 transition-colors">Limpiar / Cancelar</button>
                                <button onClick={handleSave} className="bg-rose-600 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-rose-700 transition-colors">{editId ? 'Actualizar Receta' : 'Guardar Receta'}</button>
                            </div>
                        </div>
                    )}

                    {viewMode === 'consult' && (
                        <div>
                            <div className="mb-6">
                                <SearchableSelect 
                                    options={[{id: '', label: '-- Mostrar Todas --'}, ...recipes.sort((a, b) => a.name.localeCompare(b.name)).map(r => ({ id: r.id, label: r.name }))]}
                                    value={consultSearchId}
                                    onChange={val => setConsultSearchId(val)}
                                    placeholder="Buscar receta por nombre..."
                                />
                            </div>
                            <div className="grid grid-cols-1 gap-4">
                                {recipes
                                    .sort((a, b) => a.name.localeCompare(b.name))
                                    .filter(r => consultSearchId === '' || r.id === consultSearchId)
                                    .map(r => (
                                    <details key={r.id} className="group border border-stone-200 p-5 rounded-xl shadow-sm bg-white hover:shadow-md transition-shadow">
                                        <summary className="text-xl font-bold text-stone-800 mb-2 border-b border-transparent group-open:border-stone-100 group-open:pb-2 text-rose-700 cursor-pointer flex justify-between items-center list-none [&::-webkit-details-marker]:hidden">
                                            {r.name}
                                            <i className="fas fa-chevron-down text-stone-400 group-open:rotate-180 transition-transform text-base"></i>
                                        </summary>
                                        <div className="pt-2">
                                            <p className="font-semibold text-sm text-stone-500 uppercase tracking-wider mb-2">Ingredientes</p>
                                            <ul className="list-disc pl-5 text-stone-700 mb-4 space-y-1">
                                                {r.ingredients.map((ing, i) => {
                                                    const dbItem = inventory.find(x => x.id === ing.invId);
                                                    return <li key={i}>{dbItem ? <><span className="font-medium">{dbItem.name}</span>: {ing.qty}{dbItem.unit}</> : <span className="text-rose-400 italic">Ingrediente eliminado</span>}</li>
                                                })}
                                            </ul>
                                            <p className="font-semibold text-sm text-stone-500 uppercase tracking-wider mb-2">Instrucciones</p>
                                            <p className="text-stone-600 whitespace-pre-wrap bg-stone-50 p-4 border border-stone-100 rounded-lg text-sm leading-relaxed">{r.instructions || 'Sin instrucciones'}</p>
                                        </div>
                                    </details>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- MÓDULO: ANÁLISIS Y COSTEO ---
        function Analysis({ recipes, inventory }) {
            const [selRecipeId, setSelRecipeId] = useState('');
            const [packaging, setPackaging] = useState([]);
            const [prodVars, setProdVars] = useState({ 
                totalPieces: 10, piecesPerPack: 1, marginError: 5,
                opFee: 10, utility: 50, vat: 16, terminalFee: 4.06
            });

            // Buscar la receta seleccionada
            const recipe = recipes.find(r => r.id === selRecipeId);

            // Cargar los datos de la base de datos cuando seleccionas una receta
            useEffect(() => {
                if (recipe) {
                    setPackaging(recipe.packaging || []);
                    setProdVars(recipe.prodVars || { 
                        totalPieces: 10, piecesPerPack: 1, marginError: 5,
                        opFee: 10, utility: 50, vat: 16, terminalFee: 4.06
                    });
                }
            }, [selRecipeId]); // Solo se ejecuta al cambiar la receta seleccionada

            // Función para guardar en Firebase
            const handleSaveConfig = async () => {
                if (!selRecipeId) return;
                try {
                    await window.fs.updateDoc(window.fs.doc(window.db, "recipes", selRecipeId), {
                        packaging: packaging,
                        prodVars: prodVars
                    });
                    alert("Configuración de costos guardada exitosamente");
                } catch (error) {
                    console.error("Error guardando:", error);
                    alert("Hubo un error al guardar");
                }
            };
            const empList = inventory.filter(i => i.category === 'Empaque').sort((a,b) => (a.name || '').localeCompare(b.name || ''));
            const handleAddPackaging = () => setPackaging([...packaging, { invId: '', qty: 1 }]);
            const handlePackChange = (index, field, val) => {
                const newPack = [...packaging];
                newPack[index][field] = val;
                setPackaging(newPack);
            };
            const handleRemovePack = (index) => setPackaging(packaging.filter((_, i) => i !== index));

            let totalMP = 0;
            if (recipe) {
                recipe.ingredients.forEach(ing => {
                    const item = inventory.find(x => x.id === ing.invId);
                    if (item) {
                        const itemQty = Number(item.qty) || Number(item.cantidad) || 1;
                        totalMP += (Number(item.price) / itemQty) * ing.qty;
                        //totalMP += (totalMP * (marginError/100)) + (totalMP * (opFee/100)) + totalMP;
                    }
                });
            }

            let totalEmp = 0;
            packaging.forEach(pack => {
                const item = inventory.find(x => x.id === pack.invId);
                if (item) {
                    const itemQty = Number(item.qty) || Number(item.cantidad) || 1;
                    totalEmp += (Number(item.price) / itemQty) * pack.qty;
                }
            });

            const totalPackages = prodVars.totalPieces / (prodVars.piecesPerPack || 1);
            
            const marginErrorVal = totalMP * (prodVars.marginError / 100);
            const opFeeVal = totalMP * (prodVars.opFee / 100);
            const adjustedRM = totalMP + marginErrorVal + opFeeVal;
            
            const percUtil = prodVars.utility / 100;
            const utilityVal = percUtil < 1 ? (adjustedRM * percUtil) / (1 - percUtil) : 0;

            const priceWoVat = (adjustedRM + utilityVal) / (totalPackages || 1); 
            const vat = priceWoVat * (prodVars.vat / 100);
            const terminalFee = priceWoVat * (prodVars.terminalFee / 100);
            
            const exactFinalPrice = priceWoVat + vat + terminalFee + totalEmp;
            const finalPriceRounded = Math.round(exactFinalPrice / 5) * 5;

            const costPerPack = (adjustedRM / (totalPackages || 1)) + totalEmp;
            const profitPerPack = finalPriceRounded - costPerPack;
            const profitPerPiece = profitPerPack / (prodVars.piecesPerPack || 1);
            const totalProfit = profitPerPack * totalPackages;

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <h2 className="text-xl font-bold mb-4 flex items-center text-stone-800">
                            Configuración de Producción
                        </h2>
                        <div className="mb-6">
                            <SearchableSelect 
                                options={[{id: '', label: '-- Selecciona una Receta --'}, ...recipes.sort((a, b) => a.name.localeCompare(b.name)).map(r => ({ id: r.id, label: r.name }))]}
                                value={selRecipeId}
                                onChange={val => setSelRecipeId(val)}
                                placeholder="Buscar receta para costear..."
                            />
                        </div>

                        {recipe && (
                            <>
                                {/* Empaques */}
                                <div className="mb-6 bg-stone-50 p-5 rounded-xl border border-stone-200">
                                    <h3 className="font-bold text-stone-800 mb-3 flex items-center">
                                        Empaques por receta completa
                                        <HelpBtn text="Agrega aquí cajas, etiquetas o bolsas que se usarán para empacar la receta completa. Si haces 10 galletas y cada caja lleva 5, agrega 2 cajas aquí." />
                                    </h3>
                                    {packaging.map((pack, i) => (
                                        <div key={i} className="flex gap-2 mb-3 items-center">
                                            <SearchableSelect 
                                                options={empList.map(inv => ({ id: inv.id, label: inv.name }))}
                                                value={pack.invId}
                                                onChange={val => handlePackChange(i, 'invId', val)}
                                                placeholder="Buscar empaque..."
                                            />
                                            <input type="number" placeholder="Cant" className="w-24 border border-stone-300 p-2 rounded-lg outline-none text-center" value={pack.qty} onChange={e => handlePackChange(i, 'qty', Number(e.target.value))} />
                                            <button onClick={() => handleRemovePack(i)} className="text-rose-400 hover:text-rose-600 p-2 transition-colors"><i className="fas fa-times"></i></button>
                                        </div>
                                    ))}
                                    <button onClick={handleAddPackaging} className="text-sm text-rose-600 font-bold hover:bg-rose-50 px-2 py-1 rounded transition-colors"><i className="fas fa-plus mr-1"></i> Añadir Empaque</button>
                                </div>

                                {/* Porcentajes */}
                                <div className="mb-6 bg-rose-50 p-5 rounded-xl border border-rose-100">
                                    <h3 className="font-bold text-rose-900 mb-4">Márgenes, Tarifas e Impuestos</h3>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        <div className="flex flex-col justify-between h-full">
                                            <label className="block text-xs font-bold text-rose-800 mb-2 leading-tight">
                                                Margen de Error (%)<HelpBtn text="Porcentaje de merma o error. Se sugiere 5% - 8%." />
                                            </label>
                                            <input type="number" className="w-full border border-rose-200 p-2 rounded-lg text-center outline-none mt-auto" value={prodVars.marginError} onChange={e => setProdVars({...prodVars, marginError: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex flex-col justify-between h-full">
                                            <label className="block text-xs font-bold text-rose-800 mb-2 leading-tight">
                                                Costo Operativo (%)<HelpBtn text="Desgaste de herramientas, luz, gas. Sugerido 10% - 15%." />
                                            </label>
                                            <input type="number" className="w-full border border-rose-200 p-2 rounded-lg text-center outline-none mt-auto" value={prodVars.opFee} onChange={e => setProdVars({...prodVars, opFee: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex flex-col justify-between h-full">
                                            <label className="block text-xs font-bold text-rose-800 mb-2 leading-tight">
                                                Margen de Utilidad (%)<HelpBtn text="Ganancia neta deseada. Sugerido 50% - 65%." />
                                            </label>
                                            <input type="number" className="w-full border border-rose-200 p-2 rounded-lg text-center outline-none mt-auto" value={prodVars.utility} onChange={e => setProdVars({...prodVars, utility: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex flex-col justify-between h-full">
                                            <label className="block text-xs font-bold text-rose-800 mb-2 leading-tight">
                                                Impuesto IVA (%)<HelpBtn text="Impuesto al Valor Agregado. Si no pagas ni cobras este impuesto, déjalo en 0." />
                                            </label>
                                            <input type="number" step="0.1" className="w-full border border-rose-200 p-2 rounded-lg text-center outline-none mt-auto" value={prodVars.vat} onChange={e => setProdVars({...prodVars, vat: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex flex-col justify-between h-full">
                                            <label className="block text-xs font-bold text-rose-800 mb-2 leading-tight">
                                                Comisión Terminal (%)<HelpBtn text="Comisión por cobro con tarjeta. Si cobras en efectivo, déjalo en 0." />
                                            </label>
                                            <input type="number" step="0.01" className="w-full border border-rose-200 p-2 rounded-lg text-center outline-none mt-auto" value={prodVars.terminalFee} onChange={e => setProdVars({...prodVars, terminalFee: Number(e.target.value)})} />
                                        </div>
                                    </div>
                                </div>

                                {/* Producción */}
                                <div className="grid grid-cols-3 gap-4 mb-6 bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm">
                                    <div>
                                        <label className="block text-xs font-bold text-amber-900 mb-1">Pzas Totales<HelpBtn text="Cantidad total de piezas que salen al preparar esta receta completa." /></label>
                                        <input type="number" className="w-full border border-amber-300 p-2 rounded-lg text-center font-bold text-amber-800 outline-none" value={prodVars.totalPieces} onChange={e => setProdVars({...prodVars, totalPieces: Number(e.target.value)})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-amber-900 mb-1">Pzas x Paquete<HelpBtn text="¿Cuántas piezas incluye el paquete que le vendes al cliente?" /></label>
                                        <input type="number" className="w-full border border-amber-300 p-2 rounded-lg text-center font-bold text-amber-800 outline-none" value={prodVars.piecesPerPack} onChange={e => setProdVars({...prodVars, piecesPerPack: Number(e.target.value)})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-amber-900 mb-1">Total Paquetes</label>
                                        <div className="w-full border border-amber-300 p-2 rounded-lg bg-white text-center font-extrabold text-amber-600">{totalPackages.toFixed(1)}</div>
                                    </div>
                                </div>
                                <button onClick={handleSaveConfig} className="w-full bg-stone-800 text-white font-bold py-3 rounded-xl shadow-md hover:bg-stone-900 transition-colors mb-6">
                                    <i className="fas fa-save mr-2"></i> Guardar Configuración de Receta
                                </button>
                            </>
                        )}
                    </div>

                    {recipe ? (
                        <div>
                            <h2 className="text-xl font-bold mb-4 bg-stone-800 text-stone-100 p-3 rounded-t-xl text-center shadow-sm">Hoja de Costos y Precios</h2>
                            <table className="w-full text-left mb-6 bg-white border-x border-b border-stone-200 rounded-b-xl shadow-sm overflow-hidden">
                                <tbody>
                                    <tr className="bg-stone-50 font-semibold border-b border-stone-200"><td className="p-3 text-stone-700">1. Materia Prima Total</td><td className="p-3 text-right text-stone-800">${totalMP.toFixed(2)}</td></tr>
                                    <tr className="bg-stone-50 font-semibold border-b border-stone-200"><td className="p-3 text-stone-700">2. Empaque Total (por paquete)</td><td className="p-3 text-right text-stone-800">${totalEmp.toFixed(2)}</td></tr>
                                    
                                    <tr className="border-b border-stone-100 text-stone-600"><td className="p-3">Precio de Venta Base (Sin Impuestos)</td><td className="p-3 text-right">${priceWoVat.toFixed(2)}</td></tr>
                                    <tr className="border-b border-stone-100 text-stone-600"><td className="p-3">+ IVA ({prodVars.vat}%)</td><td className="p-3 text-right">${vat.toFixed(2)}</td></tr>
                                    <tr className="border-b border-stone-100 text-stone-600"><td className="p-3">+ Comisión Terminal ({prodVars.terminalFee}%)</td><td className="p-3 text-right">${terminalFee.toFixed(2)}</td></tr>
                                    
                                    <tr className="bg-rose-600 text-white font-extrabold text-lg"><td className="p-4">PRECIO FINAL (Redondeado)</td><td className="p-4 text-right">${finalPriceRounded.toFixed(2)}</td></tr>
                                    <tr className="bg-rose-50 text-rose-800 text-xs text-center font-semibold"><td colSpan="2" className="p-2 border-t border-rose-200">Precio sugerido exacto: ${exactFinalPrice.toFixed(2)}</td></tr>
                                </tbody>
                            </table>

                            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
                                <h3 className="font-bold text-emerald-900 mb-3 border-b border-emerald-200 pb-2 uppercase tracking-wide text-sm">Proyección de Ganancias Neta</h3>
                                <div className="flex justify-between mb-2">
                                    <span className="text-emerald-800 font-medium">Ganancia por Pieza:</span>
                                    <span className="font-bold text-emerald-700">${profitPerPiece.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between mb-2">
                                    <span className="text-emerald-800 font-medium">Ganancia por Paquete:</span>
                                    <span className="font-bold text-emerald-700">${profitPerPack.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between text-lg mt-3 pt-3 border-t border-emerald-200">
                                    <span className="font-extrabold text-emerald-900">Ganancia Total Producción:</span>
                                    <span className="font-black text-emerald-700">${totalProfit.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center justify-center border-2 border-dashed border-stone-300 rounded-xl p-12 text-stone-400 bg-stone-50 mt-12">
                            <i className="fas fa-cookie-bite text-4xl mb-3 text-stone-300"></i>
                            <p className="font-medium text-center">Selecciona una receta para calcular<br/>sus costos y precio sugerido</p>
                        </div>
                    )}
                </div>
            );
        }

        // --- MÓDULO: VENTAS ---
        function Sales({ sales, recipes }) {
            const [form, setForm] = useState({ recipeId: '', qty: 1, date: new Date().toISOString().split('T')[0] });

            const handleRegisterSale = async (e) => {
                e.preventDefault();
                const r = recipes.find(x => x.id === form.recipeId);
                if(!r) return;
                
                await window.fs.addDoc(window.fs.collection(window.db, "sales"), {
                    recipeId: form.recipeId,
                    recipeName: r.name,
                    qty: Number(form.qty),
                    date: form.date,
                    timestamp: new Date().getTime()
                });
                alert("Venta registrada con éxito");
                setForm({...form, qty: 1});
            };

            const todayStr = new Date().toISOString().split('T')[0];
            const salesToday = sales.filter(s => s.date === todayStr).reduce((acc, curr) => acc + curr.qty, 0);
            const currentMonth = todayStr.substring(0, 7);
            const salesMonth = sales.filter(s => s.date.startsWith(currentMonth)).reduce((acc, curr) => acc + curr.qty, 0);

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div className="md:col-span-1 border border-stone-200 rounded-xl p-5 bg-stone-50 shadow-sm">
                        <h3 className="font-bold text-lg mb-4 flex items-center text-stone-800">
                            Registrar Venta
                            <HelpBtn text="Registra cada vez que vendas un paquete. Esto te permitirá ver qué recetas son las más populares." />
                        </h3>
                        <form onSubmit={handleRegisterSale}>
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-stone-700 mb-1">Producto / Receta</label>
                                <SearchableSelect 
                                    options={recipes.sort((a, b) => a.name.localeCompare(b.name)).map(r => ({ id: r.id, label: r.name }))}
                                    value={form.recipeId}
                                    onChange={val => setForm({...form, recipeId: val})}
                                    placeholder="Selecciona producto..."
                                />
                            </div>
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-stone-700 mb-1">Paquetes Vendidos</label>
                                <input required type="number" min="1" className="w-full border border-stone-300 p-2.5 rounded-lg outline-none focus:border-rose-500" value={form.qty} onChange={e => setForm({...form, qty: e.target.value})} />
                            </div>
                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-stone-700 mb-1">Fecha</label>
                                <input required type="date" className="w-full border border-stone-300 p-2.5 rounded-lg outline-none focus:border-rose-500" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                            </div>
                            <button type="submit" className="w-full bg-rose-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-rose-700 transition-colors">Registrar Venta</button>
                        </form>
                    </div>

                    <div className="md:col-span-2">
                        <h3 className="font-bold text-lg mb-4 text-stone-800">Dashboard de Ventas</h3>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <div className="bg-rose-600 text-white p-5 rounded-xl shadow-md text-center">
                                <p className="text-sm font-medium opacity-90 uppercase tracking-wide mb-1">Vendidos hoy</p>
                                <p className="text-4xl font-black">{salesToday}</p>
                            </div>
                            <div className="bg-amber-500 text-white p-5 rounded-xl shadow-md text-center">
                                <p className="text-sm font-medium opacity-90 uppercase tracking-wide mb-1">Vendidos este mes</p>
                                <p className="text-4xl font-black">{salesMonth}</p>
                            </div>
                        </div>

                        <h4 className="font-bold text-stone-700 mb-3 border-b border-stone-200 pb-2">Últimos Registros</h4>
                        <div className="overflow-x-auto max-h-72 border border-stone-200 rounded-xl shadow-sm">
                            <table className="w-full text-left text-sm bg-white border-collapse">
                                <thead className="bg-stone-100 sticky top-0 shadow-sm">
                                    <tr>
                                        <th className="p-3 text-stone-600 font-semibold border-b border-stone-200">Fecha</th>
                                        <th className="p-3 text-stone-600 font-semibold border-b border-stone-200">Producto</th>
                                        <th className="p-3 text-stone-600 font-semibold border-b border-stone-200 text-center">Cantidad</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sales.sort((a,b) => b.timestamp - a.timestamp).slice(0, 30).map(s => (
                                        <tr key={s.id} className="border-b border-stone-100 hover:bg-stone-50 transition-colors">
                                            <td className="p-3 text-stone-500 font-medium">{s.date}</td>
                                            <td className="p-3 font-bold text-stone-700">{s.recipeName}</td>
                                            <td className="p-3 text-center">
                                                <span className="bg-stone-100 text-stone-700 px-3 py-1 rounded-full font-bold">{s.qty}</span>
                                            </td>
                                        </tr>
                                    ))}
                                    {sales.length === 0 && <tr><td colSpan="3" className="text-center p-8 text-stone-400 italic">No hay ventas registradas aún.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
